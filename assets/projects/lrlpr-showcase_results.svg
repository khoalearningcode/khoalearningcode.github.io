" width="477" height="14" rx="7" fill="#E0E7F1"  /><rect x="1214" y="713" width="303.6900159" height="14" rx="7" fill="#C98431"  /><text x="1214" y="755" fill="#65758C" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="540" text-anchor="start" >600 tracks · 382 correct</text><line x1="1214" y1="782" x2="1693" y2="782" stroke="#D9E2EF" stroke-width="2" stroke-linecap="round" /><text x="1214" y="825" fill="#65758C" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="630" text-anchor="start" >Mercosur</text><text x="1692" y="836" fill="#078A89" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="810" text-anchor="end" >86.63%</text><rect x="1214" y="856" width="477" height="14" rx="7" fill="#E0E7F1"  /><rect x="1214" y="856" width="413.20124999999996" height="14" rx="7" fill="#078A89"  /><text x="1214" y="899" fill="#65758C" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="540" text-anchor="start" >2,400 tracks · 2,079 correct</text><text x="1214" y="974" fill="#12243F" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="690" text-anchor="start" >Gap: 22.96 percentage points</text><text x="79" y="1071" fill="#65758C" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="510" text-anchor="start" >Historical blind leaderboard: 82.13% (1st) / 81.73% (2nd) — not directly interchangeable with released-test evaluation.</text>
