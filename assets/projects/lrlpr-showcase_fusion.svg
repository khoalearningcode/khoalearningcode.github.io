f" font-size="15" font-weight="470" text-anchor="start" >model checkpoint</text><rect x="492" y="413" width="384" height="98" rx="15" fill="#F6F9FD" stroke="#D9E2EF" stroke-width="1.3" /><rect x="509" y="433" width="46" height="44" rx="11" fill="#3764EC"  /><text x="532" y="463" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="740" text-anchor="middle" >06</text><text x="573" y="463" fill="#12243F" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="start" >A2 · SP init</text><text x="573" y="490" fill="#65758C" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="470" text-anchor="start" >model checkpoint</text><rect x="906" y="413" width="384" height="98" rx="15" fill="#F0EDFF" stroke="#CBC1EE" stroke-width="1.3" /><rect x="923" y="433" width="46" height="44" rx="11" fill="#7456BD"  /><text x="946" y="463" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="740" text-anchor="middle" >07</text><text x="987" y="463" fill="#12243F" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="start" >A2 · A2-XF variant</text><text x="987" y="490" fill="#65758C" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="470" text-anchor="start" >encoder-side XF member</text><rect x="1320" y="413" width="384" height="98" rx="15" fill="#F6F9FD" stroke="#D9E2EF" stroke-width="1.3" /><rect x="1337" y="433" width="46" height="44" rx="11" fill="#3764EC"  /><text x="1360" y="463" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="740" text-anchor="middle" >08</text><text x="1401" y="463" fill="#12243F" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="start" >A2 · P init</text><text x="1401" y="490" fill="#65758C" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="470" text-anchor="start" >model checkpoint</text><line x1="270" y1="521" x2="1520" y2="521" stroke="#B0C2DF" stroke-width="3" stroke-linecap="round" /><line x1="270" y1="511" x2="270" y2="521" stroke="#B0C2DF" stroke-width="2" stroke-linecap="round" /><line x1="684" y1="511" x2="684" y2="521" stroke="#B0C2DF" stroke-width="2" stroke-linecap="round" /><line x1="1098" y1="511" x2="1098" y2="521" stroke="#B0C2DF" stroke-width="2" stroke-linecap="round" /><line x1="1512" y1="511" x2="1512" y2="521" stroke="#B0C2DF" stroke-width="2" stroke-linecap="round" /><line x1="900" y1="522" x2="900" y2="570" stroke="#3764EC" stroke-width="3" stroke-linecap="round" /><path d="M892,559 L900,570 L908,559" fill="none" stroke="#3764EC" stroke-width="3" stroke-linejoin="round"/><text x="77" y="595" fill="#3764EC" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="760" text-anchor="start" >02  TEST-TIME VIEWS  /  FOR EACH MODEL</text><rect x="79" y="622" width="535" height="129" rx="18" fill="#F6F9FD" stroke="#D9E2EF" stroke-width="1" /><rect x="105" y="649" width="145" height="72" rx="10" fill="#F2F6FC" stroke="#D9E2EF" stroke-width="1" /><g opacity="1"><rect x="113" y="661" width="129" height="48" rx="10" fill="url(#platebg)" stroke="#BBC7D8" stroke-width="1.5" /><rect x="125" y="673" width="12" height="24" rx="4" fill="#2D63CB"  /><text x="187.5" y="691.72" fill="#172A45" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" text-anchor="middle" letter-spacing="1.5">ABC1D23</text><text x="129" y="687" fill="#3C65A2" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="800" text-anchor="start" >BR</text></g><text x="276" y="669" fill="#12243F" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="770" text-anchor="start" >−2 px</text><text x="276" y="703" fill="#65758C" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="530" text-anchor="start" >replicate border</text><text x="561" y="725" fill="#3764EC" font-family="Arial, Helvetica, sans-serif"