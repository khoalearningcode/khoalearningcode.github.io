ll="#12243F" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="770" text-anchor="start" >+2 px</text><text x="1404" y="703" fill="#65758C" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="530" text-anchor="start" >replicate border</text><text x="1689" y="725" fill="#3764EC" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="760" text-anchor="end" >× 8</text><line x1="900" y1="758" x2="900" y2="800" stroke="#078A89" stroke-width="3" stroke-linecap="round" /><path d="M892,789 L900,800 L908,789" fill="none" stroke="#078A89" stroke-width="3" stroke-linejoin="round"/><rect x="80" y="812" width="1640" height="186" rx="24" fill="#183158"  /><rect x="111" y="838" width="363" height="38" rx="19" fill="#34517E"  /><text x="292.5" y="864" fill="#ECF4FF" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="760" text-anchor="middle" >03  STEP-SYNCHRONOUS FUSION</text><text x="113" y="908" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="720" text-anchor="start" >mean of 24 full-vocabulary log-probability vectors</text><text x="113" y="961" fill="#C3D4ED" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="530" text-anchor="start" >Each pair sees the same generated prefix; select EOS / 0–9 / A–Z, append token, repeat.</text><rect x="1310" y="854" width="356" height="100" rx="18" fill="#2D5B77"  /><text x="1488" y="891" fill="#D4F9F5" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="770" text-anchor="middle" >NOT string voting</text><text x="1488" y="928" fill="#C4DBEC" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="520" text-anchor="middle" >joint autoregressive prefix</text><text x="84" y="1043" fill="#65758C" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" text-anchor="start" >Full-vocabulary log-probabilities are averaged before applying the restricted greedy token choice. Confidence is not calibrated.</text>
</svg>