<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-label="LRLPR method: five-frame shared SVTRv2-B and NRTR architecture">
<title>LRLPR method: five-frame shared SVTRv2-B and NRTR architecture</title><desc>Synthetic low-resolution plate crops are resized to 40x112, encoded to 140x384 tokens each, concatenated to 700x384 memory and decoded by NRTR with two layers and twelve heads.</desc>
<defs>
<linearGradient id="darkbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0C1830"/><stop offset="100%" stop-color="#234373"/></linearGradient>
<linearGradient id="lightbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#EAF2FF"/></linearGradient>
<linearGradient id="platebg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#E8EDF4"/><stop offset="50%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#DCE4EF"/></linearGradient>
<filter id="depth" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#12305B" flood-opacity=".13"/></filter>
</defs>
