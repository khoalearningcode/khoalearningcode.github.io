"><rect x="1106" y="310" width="255" height="78" rx="10" fill="url(#platebg)" stroke="#BBC7D8" stroke-width="1.5" /><rect x="1118" y="322" width="12" height="54" rx="4" fill="#2D63CB"  /><text x="1243.5" y="359.92" fill="#172A45" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800" text-anchor="middle" letter-spacing="1.5">ABC1D23</text><text x="1122" y="336" fill="#3C65A2" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="800" text-anchor="start" >BR</text><rect x="1324" y="316" width="29" height="21" rx="4" fill="#E6EDF7"  /><text x="1339" y="331" fill="#172A45" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="740" text-anchor="middle" >4</text></g><text x="1233" y="419" fill="#65758C" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="740" text-anchor="middle" >FRAME 4    /    LR</text><rect x="1419" y="285" width="301" height="151" rx="19" fill="#F6F9FD" stroke="#D9E2EF" stroke-width="1.4" /><g opacity="1"><rect x="1442" y="310" width="255" height="78" rx="10" fill="url(#platebg)" stroke="#BBC7D8" stroke-width="1.5" /><rect x="1454" y="322" width="12" height="54" rx="4" fill="#2D63CB"  /><text x="1579.5" y="359.92" fill="#172A45" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800" text-anchor="middle" letter-spacing="1.5">ABC1D23</text><text x="1458" y="336" fill="#3C65A2" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="800" text-anchor="start" >BR</text><rect x="1660" y="316" width="29" height="21" rx="4" fill="#E6EDF7"  /><text x="1675" y="331" fill="#172A45" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="740" text-anchor="middle" >5</text></g><text x="1569" y="419" fill="#65758C" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="740" text-anchor="middle" >FRAME 5    /    LR</text><line x1="222" y1="452" x2="1568" y2="452" stroke="#AFC1DF" stroke-width="3" stroke-linecap="round" /><lin