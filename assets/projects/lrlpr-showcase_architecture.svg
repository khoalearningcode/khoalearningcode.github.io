72EB"  /><rect x="421" y="700" width="11" height="8" rx="2" fill="#4D72EB"  /><rect x="439" y="700" width="11" height="8" rx="2" fill="#4D72EB"  /><rect x="457" y="700" width="11" height="8" rx="2" fill="#4D72EB"  /><rect x="475" y="700" width="11" height="8" rx="2" fill="#4D72EB"  /><rect x="493" y="700" width="11" height="8" rx="2" fill="#4D72EB"  /><rect x="511" y="700" width="11" height="8" rx="2" fill="#4D72EB"  /><line x1="587" y1="744" x2="648" y2="744" stroke="#3764EC" stroke-width="3" stroke-linecap="round" /><path d="M637,736 L648,744 L637,752" fill="none" stroke="#3764EC" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="659" y="580" width="505" height="337" rx="23" fill="#DCF6F2" stroke="#A9E3DD" stroke-width="1.5" /><rect x="684" y="601" width="211" height="38" rx="19" fill="#078A89"  /><text x="789.5" y="627" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="760" text-anchor="middle" >03  JOINT MEMORY</text><text x="684" y="679" fill="#0E1A31" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="750" text-anchor="start" >Frame embeddings</text><text x="684" y="724" fill="#12243F" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="540" text-anchor="start" >+ concatenated tokens</text><text x="684" y="798" fill="#078A89" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="800" text-anchor="start" >700 × 384</text><text x="686" y="842" fill="#65758C" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" text-anchor="start" >One memory across all 5 frames</text><line x1="1178" y1="744" x2="1243" y2="744" stroke="#078A89" stroke-width="3" stroke-linecap="round" /><path d="M1232,736 L1243,744 L1232,752" fill="none" stroke="#078A89" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="1254" y="580" width="468" height="337" rx="23" fill="#F6F9FD" stroke="#D9E2EF" stroke-width="1.5" /><rect x="1280" y="6